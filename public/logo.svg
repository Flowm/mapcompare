<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="mapcompare">
  <rect width="64" height="64" rx="12" fill="#0b0f14" />
  <!-- Left half: coarse, low-resolution imagery -->
  <g clip-path="inset(0 50% 0 0)">
    <rect x="8" y="8" width="48" height="48" rx="5" fill="#1e3a2f" />
    <rect x="8" y="8" width="16" height="16" fill="#24503c" />
    <rect x="24" y="24" width="16" height="16" fill="#2c6349" />
    <rect x="8" y="40" width="16" height="16" fill="#2a5a43" />
    <rect x="40" y="8" width="16" height="16" fill="#1f4534" />
  </g>
  <!-- Right half: fine, high-resolution imagery -->
  <g clip-path="inset(0 0 0 50%)">
    <rect x="8" y="8" width="48" height="48" rx="5" fill="#2c6349" />
    <g fill="#3d8a63">
      <rect x="32" y="8" width="6" height="6" /><rect x="44" y="8" width="6" height="6" />
      <rect x="38" y="14" width="6" height="6" /><rect x="50" y="14" width="6" height="6" />
      <rect x="32" y="20" width="6" height="6" /><rect x="44" y="20" width="6" height="6" />
      <rect x="38" y="26" width="6" height="6" /><rect x="50" y="26" width="6" height="6" />
      <rect x="32" y="32" width="6" height="6" /><rect x="44" y="32" width="6" height="6" />
      <rect x="38" y="38" width="6" height="6" /><rect x="50" y="38" width="6" height="6" />
      <rect x="32" y="44" width="6" height="6" /><rect x="44" y="44" width="6" height="6" />
      <rect x="38" y="50" width="6" height="6" /><rect x="50" y="50" width="6" height="6" />
    </g>
  </g>
  <!-- The swipe divider -->
  <rect x="30.5" y="8" width="3" height="48" fill="#38bdf8" />
  <circle cx="32" cy="32" r="6" fill="#0b0f14" />
  <circle cx="32" cy="32" r="4.5" fill="#38bdf8" />
</svg>
